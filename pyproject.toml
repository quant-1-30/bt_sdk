[tool.poetry]
name = "bt-sdk"
version = "0.3.7"
description = "revise coro was destroyed but is still pending"
authors = ["hengxin.liu <hengxin.liu@inceptio.ai>"]
readme = "README.md"
packages = [
  { include = "bt_sdk"}
]

[tool.poetry.dependencies]
python = "^3.9"
toolz = "^1.0.0"
pandas = "^2.2.3"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
msgpack = "^1.1.0"
devpi-client = "^7.2.0"
pyzmq = "^26.4.0"
pydantic = "^2.6"
typing-inspection = "^0.4.0"
pydantic-core = "^2.16"
ping3 = "^4.0.8"

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true   

[[tool.poetry.source]]
name = "devpi"
url = "http://localhost:3141/bt_sdk/dev/+simple/"
secondary = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
